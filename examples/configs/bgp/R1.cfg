# R1 - eBGP
# R1(AS 65001) --- R2(AS 65002), each with a loopback used as the BGP source.
# Without update-source the session would try to come up from the physical
# interface, which is not the address the peer expects.

sysname R1

interface LoopBack0
 ip address 10.0.1.1 255.255.255.0

interface GigabitEthernet0/0/1
 ip address 10.0.12.1 255.255.255.0

bgp 65001
 router-id 10.0.1.1
 peer 10.0.12.2 as-number 65002
 network 10.0.1.0 255.255.255.0
 ipv4-family unicast
  network 10.0.1.0 255.255.255.0
  peer 10.0.12.2 enable
