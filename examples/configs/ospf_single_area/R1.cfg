# R1 - single area OSPF (area 0)
# Topology: R1(GE0/0/1) --- (GE0/0/0)R2(GE0/0/1) --- (GE0/0/0)R3
# Router IDs are the loopbacks, which is what the example topo file documents.

sysname R1

interface LoopBack0
 ip address 10.0.1.1 255.255.255.0

interface GigabitEthernet0/0/1
 ip address 10.0.12.1 255.255.255.0

ospf 1 router-id 10.0.1.1
 area 0.0.0.0
  network 10.0.1.0 0.0.0.255
  network 10.0.12.0 0.0.0.255
