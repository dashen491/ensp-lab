# SW1 - VLAN, trunk and STP
# Topology: SW1(GE0/0/1) --- (GE0/0/1)SW2
# GE0/0/1 carries both VLANs as a trunk, so a PC in VLAN 10 on SW1 can reach
# a PC in VLAN 10 on SW2 but not the VLAN 20 host on SW2.
# STP is pinned to MSTP (the VRP default) with SW1 forced to be root.

sysname SW1

vlan batch 10 20

interface GigabitEthernet0/0/1
 port link-type trunk
 port trunk allow-pass vlan 10 20

interface GigabitEthernet0/0/2
 port link-type access
 port default vlan 10

stp mode mstp
stp instance 0 root primary
