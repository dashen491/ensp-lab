sysname L3
vlan batch 100 102 200
stp mode mstp
stp instance 0 root secondary
interface Eth-Trunk1
 mode lacp-static
 port link-type trunk
 port trunk allow-pass vlan 100 200
interface GigabitEthernet0/0/3
 eth-trunk 1
interface GigabitEthernet0/0/4
 eth-trunk 1
interface GigabitEthernet0/0/1
 port link-type trunk
 port trunk allow-pass vlan 100 200
interface GigabitEthernet0/0/2
 port link-type access
 port default vlan 102
interface Vlanif100
 ip address 192.168.100.201 255.255.255.0
 vrrp vrid 1 virtual-ip 192.168.100.254
interface Vlanif102
 ip address 192.168.102.1 255.255.255.0
interface Vlanif200
 ip address 192.168.200.201 255.255.255.0
 vrrp vrid 1 virtual-ip 192.168.200.254
interface LoopBack0
 ip address 3.3.3.3 255.255.255.255
ospf 1 router-id 3.3.3.3
 area 0.0.0.0
  network 192.168.100.0 0.0.0.255
  network 192.168.200.0 0.0.0.255
  network 192.168.102.0 0.0.0.255
  network 3.3.3.3 0.0.0.0
