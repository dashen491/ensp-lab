# R1 - static routing lab
# Topology: R1(GE0/0/1) --- (GE0/0/0)R2(GE0/0/1) --- (GE0/0/0)R3
# Replace the interface names if your wiring differs.

sysname R1

interface LoopBack0
 ip address 10.0.1.1 255.255.255.0

interface GigabitEthernet0/0/1
 ip address 10.0.12.1 255.255.255.0

# R3's loopback is only reachable through R2, so it needs an explicit route.
ip route-static 10.0.3.0 255.255.255.0 10.0.12.2
